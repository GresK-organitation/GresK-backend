spring:
  application:
    name: gresk-backend

  # CONFIGURACIÓN CRUCIAL: Debe estar al mismo nivel que 'application'
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT}/gresk_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  main:
    web-application-type: servlet

  # ── Agenda: notificaciones por email ────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@gresk.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Email Intelligence Engine: modelos del pipeline híbrido ─────────────────
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-configured}
      chat:
        options:
          model: claude-haiku-4-5-20251001

# --- SECCIONES FUERA DE 'SPRING' ---

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

gresk:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001,http://localhost:8080"
  contract:
    # Token compartido que el proveedor de firma (Signaturit/DocuSign/stub) añade
    # como query param al webhook de cambio de estado
    signature-webhook-token: ${CONTRACT_SIGNATURE_WEBHOOK_TOKEN:}
  email:
    ai:
      confidence-threshold: 0.85
      claude-model: claude-haiku-4-5-20251001
      max-attempts: 3
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      redirect-uri: ${APP_BASE_URL:http://localhost:8080}/api/v1/email/gmail/callback
      pubsub-topic: ${GMAIL_PUBSUB_TOPIC:}
      pubsub-verification-token: ${GMAIL_PUBSUB_TOKEN:}
    encryption:
      key: ${EMAIL_TOKEN_ENCRYPTION_KEY:}   # 256-bit en base64 (openssl rand -base64 32)
  images:
    default-url: "https://res.cloudinary.com/dzfgoh6hu/image/upload/c_fill,g_auto,w_1200,h_675/arde-bogota_98.jpg_bmbxtw.png"
    # Añadimos la extensión al final del template para asegurar que el navegador la lea bien
    asset-url-template: "https://res.cloudinary.com/dzfgoh6hu/image/upload/c_fill,g_auto,w_1200,h_675/{assetId}.png"
  videos:
    asset-url-template: "https://res.cloudinary.com/dzfgoh6hu/video/upload/{assetId}.mp4"
  tendencias:
    chronicle:
      polling-interval-ms: 1800000   # 30 min
      max-entries-per-fetch: 30
  agenda:
    google-calendar:
      client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
      client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
      redirect-uri: ${APP_BASE_URL:http://localhost:8080}/api/v1/agenda/calendar-sync/google/callback
      webhook-url: ${GOOGLE_CALENDAR_WEBHOOK_URL:}
    outlook:
      client-id: ${OUTLOOK_CLIENT_ID:}
      client-secret: ${OUTLOOK_CLIENT_SECRET:}
      tenant-id: ${OUTLOOK_TENANT_ID:common}
      redirect-uri: ${APP_BASE_URL:http://localhost:8080}/api/v1/agenda/calendar-sync/outlook/callback
      webhook-url: ${OUTLOOK_WEBHOOK_URL:}
    calendar-sync:
      encryption-key: ${CALENDAR_TOKEN_ENCRYPTION_KEY:}   # 256-bit en base64 (openssl rand -base64 32)

# ── Resiliencia de la capa Claude (capa 3 del pipeline) ──────────────────────
resilience4j:
  ratelimiter:
    instances:
      claudeApi:
        limit-for-period: 50
        limit-refresh-period: 60s
        timeout-duration: 5s
      # Módulo Tendencias: fetch de feeds RSS de medios externos
      rssFeed:
        limit-for-period: 10
        limit-refresh-period: 60s
        timeout-duration: 5s
      # Módulo Discovery: MusicBrainz exige 1 req/s como máximo
      musicbrainz:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 2s
  circuitbreaker:
    instances:
      claudeApi:
        failure-rate-threshold: 50
        # mínimo 5 llamadas para evaluar la tasa de fallo: con 5 fallos
        # consecutivos el breaker abre (el issue omitía este parámetro y
        # con el default de la ventana nunca abriría con 5 fallos)
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      rssFeed:
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 6
        wait-duration-in-open-state: 5m
        permitted-number-of-calls-in-half-open-state: 2
      musicbrainz:
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 6
        wait-duration-in-open-state: 5m
        permitted-number-of-calls-in-half-open-state: 2

spotify:
  client-id: ${SPOTIFY_CLIENT_ID}
  client-secret: ${SPOTIFY_CLIENT_SECRET}
  auth-url: https://accounts.spotify.com/api/token
  api-url: https://api.spotify.com/v1

musicbrainz:
  api-url: https://musicbrainz.org/ws/2
  user-agent: "gresk-backend/1.0 (contacto@gresk.app)"

bandsintown:
  app-id: ${BANDSINTOWN_APP_ID}
  api-url: https://rest.bandsintown.com